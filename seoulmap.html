<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서울 교육 환경 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2F8;--surface:#FFFFFF;--ink:#1D1B2E;--muted:#6A6780;--line:#DAD7E9;
  --c1:#E1DDF1;--c2:#BDB5E0;--c3:#9487CC;--c4:#6451AE;--c5:#3A2380;
  --pa1:var(--c1);--pa2:var(--c2);--pa3:var(--c3);--pa4:var(--c4);--pa5:var(--c5);
  --pb1:#C9E8E5;--pb2:#9FD8D2;--pb3:#5DB8B0;--pb4:#1F837E;--pb5:#0B4F4B;
  --pc1:#F8DDB0;--pc2:#F5C97F;--pc3:#E8A23D;--pc4:#B8681A;--pc5:#7A3E08;
  --t1:#1D1B2E;--t2:#1D1B2E;--t3:#14122A;--t4:#FFFFFF;--t5:#FFFFFF;
  --b1:#E8E8E8;--b2:#DFB0D6;--b3:#BE64AC;--b4:#ACE4E4;--b5:#A5ADD3;--b6:#8C62AA;--b7:#5AC8C8;--b8:#5698B9;--b9:#3B4994;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#14131C;--surface:#1D1B29;--ink:#ECEAF6;--muted:#A19DBA;--line:#34304B;
--c1:#2B2942;--c2:#443F7D;--c3:#6A5FB8;--c4:#9D8FE0;--c5:#D6CCFF;
--t1:#ECEAF6;--t2:#ECEAF6;--t3:#FFFFFF;--t4:#14122A;--t5:#14122A;
--b1:#2D2C3A;--b2:#8A5C9E;--b3:#C07AD4;--b4:#3E8A8E;--b5:#7C8FC0;--b6:#A98AE0;--b7:#5ED0CF;--b8:#78B4DE;--b9:#9CA3FF;
--pb1:#1E3A3A;--pb2:#2C6B68;--pb3:#3F9E99;--pb4:#6FCFC8;--pb5:#B5F0EA;
--pc1:#3D2E17;--pc2:#7A5521;--pc3:#B87F2B;--pc4:#E3A64A;--pc5:#FFD995; }
}
:root[data-theme="dark"]{ --bg:#14131C;--surface:#1D1B29;--ink:#ECEAF6;--muted:#A19DBA;--line:#34304B;
--c1:#2B2942;--c2:#443F7D;--c3:#6A5FB8;--c4:#9D8FE0;--c5:#D6CCFF;
--t1:#ECEAF6;--t2:#ECEAF6;--t3:#FFFFFF;--t4:#14122A;--t5:#14122A;
--b1:#2D2C3A;--b2:#8A5C9E;--b3:#C07AD4;--b4:#3E8A8E;--b5:#7C8FC0;--b6:#A98AE0;--b7:#5ED0CF;--b8:#78B4DE;--b9:#9CA3FF;
--pb1:#1E3A3A;--pb2:#2C6B68;--pb3:#3F9E99;--pb4:#6FCFC8;--pb5:#B5F0EA;
--pc1:#3D2E17;--pc2:#7A5521;--pc3:#B87F2B;--pc4:#E3A64A;--pc5:#FFD995; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}

.page{max-width:1200px;margin:0 auto;padding:28px 20px 40px}
header{max-width:760px;margin-bottom:22px}
h1{margin:0 0 20px;font-size:clamp(26px,4.6vw,40px);line-height:1.18;font-weight:700;letter-spacing:-.02em;word-break:keep-all}
.lede{margin:0 0 6px;color:var(--muted);font-size:15px;word-break:keep-all}
.mtitle{margin:0 0 6px;font-size:clamp(18px,3vw,22px);font-weight:700;letter-spacing:-.01em;word-break:keep-all}
.insight{margin:0;font-size:16px;font-weight:500;word-break:keep-all}

.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:22px;align-items:start}
.mapwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:500}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

#map{display:block;width:100%;height:auto;touch-action:manipulation}
.cell{stroke:var(--surface);stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer;transition:opacity .15s,fill .25s}
.cell[data-c="1"]{fill:var(--c1)}.cell[data-c="2"]{fill:var(--c2)}.cell[data-c="3"]{fill:var(--c3)}
.cell[data-c="4"]{fill:var(--c4)}.cell[data-c="5"]{fill:var(--c5)}
.cell:focus{outline:none}
.dim{opacity:.16}
#hl{fill:none;stroke:var(--ink);stroke-width:3px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
.lbl{pointer-events:none;text-anchor:middle;transition:opacity .15s}
.lbl .n{font-weight:700}.lbl .v{font-weight:400}
.lbl[data-c="1"]{fill:var(--t1)}.lbl[data-c="2"]{fill:var(--t2)}.lbl[data-c="3"]{fill:var(--t3)}
.lbl[data-c="4"]{fill:var(--t4)}.lbl[data-c="5"]{fill:var(--t5)}

.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.chips .cap{font-size:13px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 11px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.chips .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.sub{margin:14px 0 4px;font-size:13px;color:var(--muted);font-weight:500}
.rows.tight li{padding:6px 0;font-size:13.5px}

.doms{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 10px;overflow-x:auto;scrollbar-width:none}
.dom{white-space:nowrap;flex:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:transparent;color:var(--muted);padding:8px 14px;font-size:15px;font-weight:500}
.dom[aria-pressed="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.jumps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.jumps button{width:100%;display:grid;grid-template-columns:4.4em 1fr auto;gap:10px;align-items:baseline;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 0;font-size:13.5px;font-variant-numeric:tabular-nums}
.jumps button[aria-current="true"]{font-weight:700}
.jumps .dm{color:var(--muted);font-weight:400}

[hidden]{display:none!important}
#map[data-mode="rel"] .cell[data-c="1"]{fill:var(--b1)}#map[data-mode="rel"] .cell[data-c="2"]{fill:var(--b2)}
#map[data-mode="rel"] .cell[data-c="3"]{fill:var(--b3)}#map[data-mode="rel"] .cell[data-c="4"]{fill:var(--b4)}
#map[data-mode="rel"] .cell[data-c="5"]{fill:var(--b5)}#map[data-mode="rel"] .cell[data-c="6"]{fill:var(--b6)}
#map[data-mode="rel"] .cell[data-c="7"]{fill:var(--b7)}#map[data-mode="rel"] .cell[data-c="8"]{fill:var(--b8)}
#map[data-mode="rel"] .cell[data-c="9"]{fill:var(--b9)}
#map[data-mode="rel"] .lbl{fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:calc(3px / var(--k,1));stroke-linejoin:round}
.biv{display:grid;grid-template-columns:auto auto;grid-template-areas:"y grid" ". x";gap:6px 8px;justify-content:start;margin-top:8px;align-items:stretch}
.bv-y{grid-area:y;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;color:var(--muted);text-align:right}
.bv-x{grid-area:x;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:12px}
.bv-grid{grid-area:grid;display:grid;grid-template-columns:repeat(3,44px);grid-auto-rows:34px;gap:3px}
.bv{border:1px solid var(--line);border-radius:5px;padding:0;font-size:12px;font-weight:500;color:var(--ink)}
.bv span{background:var(--surface);color:var(--ink);border-radius:999px;padding:1px 7px}
.bv[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:1px}
.bv[data-c="1"]{background:var(--b1)}.bv[data-c="2"]{background:var(--b2)}.bv[data-c="3"]{background:var(--b3)}
.bv[data-c="4"]{background:var(--b4)}.bv[data-c="5"]{background:var(--b5)}.bv[data-c="6"]{background:var(--b6)}
.bv[data-c="7"]{background:var(--b7)}.bv[data-c="8"]{background:var(--b8)}.bv[data-c="9"]{background:var(--b9)}
.bvnote{margin:6px 0 0;font-size:12.5px;color:var(--muted);word-break:keep-all}
#sc{display:block;width:100%;height:auto;margin:8px 0 4px}
#sc .grid{stroke:var(--line);stroke-width:1}
#sc .axis{stroke:var(--muted);stroke-width:1}
#sc text{fill:var(--muted);font-size:11px}
#sc .trend{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
#sc .pt{stroke:var(--ink);stroke-width:1;cursor:pointer;transition:r .12s}
#sc .pt.hot{stroke-width:2.5}
#sc .pt:focus{outline:none;stroke-width:2.5}
#sc #sclbl{fill:var(--ink);font-size:12.5px;font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.reading{color:var(--ink)!important}

.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.sel{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.sel select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 8px;width:100%}
#stage{position:relative;width:100%;height:clamp(340px,56vw,540px);border-radius:10px;overflow:hidden;background:var(--bg)}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#stagelabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sl{position:absolute;left:0;top:0;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 3px var(--surface)}
.sl.on{font-size:13px}
.viewbtns{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0}
.viewbtns .cap{font-size:13px;color:var(--muted);margin-right:2px}
.clegend .legend{margin-top:8px}
.clegend p{margin:4px 0;font-size:12.5px;color:var(--muted);word-break:keep-all}
.dot3{display:inline-block;width:11px;height:11px;border-radius:50%;background:#F0A830;border:1px solid var(--line);vertical-align:-1px;margin-right:4px}


.mapbox{position:relative}
#map{cursor:grab;user-select:none;-webkit-user-select:none}
.zbar{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zbar button{width:36px;height:36px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-size:18px;line-height:1;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.zbar button.txt{font-size:12px;font-weight:500}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;line-height:1.45;box-shadow:0 3px 10px rgba(0,0,0,.14);max-width:230px;word-break:keep-all;font-variant-numeric:tabular-nums}
.zhint{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.lbl .r{font-weight:400;opacity:.85}

#ov{position:relative}
#ov .ovwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px}
#ovgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:4px}
.ovp{min-width:0}
.ovh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ovh .g{font-size:15px;font-weight:700;white-space:nowrap}
.ovh select{flex:1;min-width:0;font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 6px}
.ovp svg{display:block;width:100%;height:auto}
.ovp .hl{fill:none;stroke:var(--ink);stroke-width:2.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
.ovp .cell{stroke-width:1px}
.ovl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.ovl .ramp{display:flex;gap:2px;flex:1;max-width:150px}
.ovl .ramp .sw{flex:1;width:auto;height:10px;border-radius:3px}
i.sw{display:inline-block}
.ovd{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.ovn{font-size:20px;font-weight:700;margin-bottom:6px}
.ovcols{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.ovc .gg{font-size:12px;color:var(--muted)}
.ovc .tt{font-size:12.5px;word-break:keep-all}
.ovc .vv{font-size:26px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.ovc .rr{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.gaprow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.gaprow .cap{font-size:13px;color:var(--muted);margin-right:2px}
#ovextra{margin-top:10px}
@media (max-width:900px){
  #ovgrid{grid-template-columns:minmax(0,1fr)}
}

[data-p="a"] .cell[data-c="1"],[data-p="a"] .sw[data-c="1"]{fill:var(--pa1);background:var(--pa1)}
[data-p="a"] .cell[data-c="2"],[data-p="a"] .sw[data-c="2"]{fill:var(--pa2);background:var(--pa2)}
[data-p="a"] .cell[data-c="3"],[data-p="a"] .sw[data-c="3"]{fill:var(--pa3);background:var(--pa3)}
[data-p="a"] .cell[data-c="4"],[data-p="a"] .sw[data-c="4"]{fill:var(--pa4);background:var(--pa4)}
[data-p="a"] .cell[data-c="5"],[data-p="a"] .sw[data-c="5"]{fill:var(--pa5);background:var(--pa5)}
[data-p="b"] .cell[data-c="1"],[data-p="b"] .sw[data-c="1"]{fill:var(--pb1);background:var(--pb1)}
[data-p="b"] .cell[data-c="2"],[data-p="b"] .sw[data-c="2"]{fill:var(--pb2);background:var(--pb2)}
[data-p="b"] .cell[data-c="3"],[data-p="b"] .sw[data-c="3"]{fill:var(--pb3);background:var(--pb3)}
[data-p="b"] .cell[data-c="4"],[data-p="b"] .sw[data-c="4"]{fill:var(--pb4);background:var(--pb4)}
[data-p="b"] .cell[data-c="5"],[data-p="b"] .sw[data-c="5"]{fill:var(--pb5);background:var(--pb5)}
[data-p="c"] .cell[data-c="1"],[data-p="c"] .sw[data-c="1"]{fill:var(--pc1);background:var(--pc1)}
[data-p="c"] .cell[data-c="2"],[data-p="c"] .sw[data-c="2"]{fill:var(--pc2);background:var(--pc2)}
[data-p="c"] .cell[data-c="3"],[data-p="c"] .sw[data-c="3"]{fill:var(--pc3);background:var(--pc3)}
[data-p="c"] .cell[data-c="4"],[data-p="c"] .sw[data-c="4"]{fill:var(--pc4);background:var(--pc4)}
[data-p="c"] .cell[data-c="5"],[data-p="c"] .sw[data-c="5"]{fill:var(--pc5);background:var(--pc5)}
body[data-dom="public"]{--c1:var(--pb1);--c2:var(--pb2);--c3:var(--pb3);--c4:var(--pb4);--c5:var(--pb5)}
body[data-dom="path"]{--c1:var(--pc1);--c2:var(--pc2);--c3:var(--pc3);--c4:var(--pc4);--c5:var(--pc5)}
.ovl{display:block}
.ovl .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ovl .ovb{margin-top:2px;font-size:11.5px;color:var(--muted)}
.ovx{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 16px 14px}
.dstrip{display:block;width:100%;height:30px;margin:4px 0 2px}
.dstrip .ln{stroke:var(--line);stroke-width:2}
.dstrip .dt{fill:var(--muted);opacity:.55}
.dstrip .tk{stroke:var(--ink);stroke-width:1.5}
.dstrip .sel{stroke:var(--ink);stroke-width:2}
.dstrip text{fill:var(--muted);font-size:9px}

.legend{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px}
.lg{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;font-size:13px}
.lg[aria-pressed="true"]{border-color:var(--ink)}
.sw{width:18px;height:18px;border-radius:5px;border:1px solid var(--line);flex:none}
.sw[data-c="1"]{background:var(--c1)}.sw[data-c="2"]{background:var(--c2)}.sw[data-c="3"]{background:var(--c3)}
.sw[data-c="4"]{background:var(--c4)}.sw[data-c="5"]{background:var(--c5)}
.lg small{color:var(--muted);font-size:12px}

.panel{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.big{display:flex;align-items:baseline;gap:8px;margin:2px 0 10px}
.big b{font-size:44px;line-height:1.1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:14px}
.rows{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.rows li{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.rows li.cur{font-weight:700}
.rows .rk{color:var(--muted);min-width:3.4em;text-align:right;font-weight:400}
.note{margin:10px 0 0;font-size:13.5px;color:var(--muted);word-break:keep-all}
.reset{margin-top:10px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 11px;font-size:13px}

.rank{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(13,auto);gap:0 14px}
.rank button{width:100%;display:grid;grid-template-columns:1.7em 12px 1fr auto;align-items:center;gap:7px;border:0;background:transparent;text-align:left;padding:5px 4px;border-radius:6px;font-size:13.5px;font-variant-numeric:tabular-nums}
.rank button:hover,.rank button.on{background:var(--bg)}
.rank .r{color:var(--muted);text-align:right}
.rank .dot{width:12px;height:12px;border-radius:4px;border:1px solid var(--line)}
.rank .dot[data-c="1"]{background:var(--c1)}.rank .dot[data-c="2"]{background:var(--c2)}.rank .dot[data-c="3"]{background:var(--c3)}
.rank .dot[data-c="4"]{background:var(--c4)}.rank .dot[data-c="5"]{background:var(--c5)}
.rank-card h3{margin:0 0 8px;font-size:14px;font-weight:500;color:var(--muted)}

footer{margin-top:22px;color:var(--muted);font-size:12.5px;max-width:760px;word-break:keep-all}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}
}
@media (max-width:440px){
  .dom{padding:8px 7px;font-size:14px}
  .page{padding:20px 12px 32px}
  .mapwrap{padding:10px 8px}
  .big b{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- 지도 중심 레이아웃: 좌측 세로 메뉴 / 큰 지도 / 하단 좌측 작은 정보 ---- */
.page{max-width:1480px;padding:18px 16px 28px}
h1{margin:0 0 12px;font-size:clamp(22px,3.4vw,30px)}
.shell{display:grid;grid-template-columns:128px minmax(0,1fr);gap:18px;align-items:start}
.main{min-width:0}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:16px}
.side .dom{width:100%;text-align:left;margin:0;padding:8px 12px;border:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;font-size:14px;white-space:normal;word-break:keep-all;color:var(--muted)}
.side .dom:hover{background:var(--surface);color:var(--ink)}
.side .dom[aria-pressed="true"]{background:var(--surface);border-left-color:var(--ink);color:var(--ink);font-weight:700}
.layout{display:block}
#ovgrid{display:block;margin-top:0}
.mapwrap,#ov .ovwrap{padding:8px 8px 6px}
.zhint{display:none}
#mapbox,.ovbox,.ovfoot{position:relative;width:100%;max-width:max(560px,calc((100vh - 190px)*1.209));margin:0 auto}
.ovh{flex-wrap:wrap;margin-bottom:6px}
#relcard{max-width:460px;margin-top:10px}
.dock{position:absolute;left:6px;bottom:6px;z-index:3;width:min(270px,36%);padding:7px 10px;border-radius:10px;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.1);font-size:12px;line-height:1.4}
.dock:empty{display:none}
.dock h2,.dock .ovn{font-size:14.5px;margin:0 0 3px;font-weight:700}
.dock .rows li{padding:3px 0;font-size:12px;gap:8px}
.dock .reset{margin-top:4px;padding:2px 8px;font-size:11.5px}
.dock .ovc{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;padding:3px 6px;border:1px solid transparent;border-radius:6px;cursor:pointer}
.dock .ovc.on{border-color:var(--ink);background:var(--bg)}
.dock .ovc .gg{font-size:11.5px;color:var(--muted)}
.dock .ovc .vv{font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.dock .ovc .rr{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.dock .sw{width:10px;height:10px;border-radius:3px}
.ovfoot{display:flex;align-items:flex-start;gap:14px;margin-top:8px}
.ovfoot .dock{position:static;flex:none;width:270px;box-shadow:none;border:1px solid var(--ink)}
.ovfoot .ovl{flex:1;min-width:0;margin-top:0}
body[data-dom="combo"] .dock{position:static;width:auto;margin-top:10px;box-shadow:none}
.stagerow{display:grid;grid-template-columns:236px minmax(0,1fr);gap:14px;align-items:start}
.stagecol{min-width:0}
.legcol .legend{flex-direction:column;flex-wrap:nowrap;gap:2px;margin:2px 0 10px}
.legcol .lg{padding:2px 0}
.legcol .clegend p{margin:6px 0 2px}
.bx{display:inline-flex;align-items:center;justify-content:center;width:28px;flex:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px}
  .side{flex-direction:row;overflow-x:auto;position:static;border-bottom:1px solid var(--line);scrollbar-width:none}
  .side .dom{width:auto;flex:none;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;margin-bottom:-1px;border-radius:0;padding:8px 12px}
  .side .dom[aria-pressed="true"]{background:transparent;border-bottom-color:var(--ink)}
  .dock{position:static;width:auto;margin-top:8px;box-shadow:none}
  .stagerow{grid-template-columns:minmax(0,1fr)}
  .ovfoot{flex-wrap:wrap}
  .ovfoot .dock{width:100%;margin-top:0}
}
</style>
</head>

          </div>
        </div>
      </div>
    </section>

function metricsFor(dm,ct){
  if(dm==='private') return ct==='all'?['per10k','academies','students']:['per10k','academies','share','students'];
  if(dm==='public') return ['ratio','teachers','pstudents'];
  return ['rate','pcount'];
}
const metrics=()=>(dom()==='rel'||dom()==='combo')?[]:metricsFor(dom(),cat());

function val(d,m){
  const c=cat();
  switch(m){
    case 'students': return d.students;
    case 'per10k': return c==='all'?d.per10k:arr(d)[IDX[c]]/d.students*1e4;
    case 'academies': return c==='all'?d.academies:arr(d)[IDX[c]];
    case 'share': {const a=arr(d); return a[IDX[c]]/a.reduce((x,y)=>x+y,0)*100}
    case 'ratio': {const [S,T]=lv(d,c); return S/T}
    case 'teachers': return lv(d,c)[1];
    case 'pstudents': return lv(d,c)[0];
    case 'rate': return pc(d,c)/d.E.grad*100;
    case 'pcount': return pc(d,c);
  }
}
const rankOf=(d,m)=>1+D.filter(o=>val(o,m)>val(d,m)).length;

function title(m){
  if(dom()==='rel') return `학원 밀도와 ${PATHN[ST.rel.y]} 진학률의 관계`;
  if(dom()==='combo') return '사설교육·공교육·진학을 한 화면에서';
  m=m||met(); const c=cat(), dm=dom();
  if(m==='students') return '초중고 학생 수';
  if(dm==='private'){
    if(c==='all') return m==='per10k'?'학생 1만 명당 사설학원 수':'사설학원 수';
    if(m==='per10k') return `학생 1만 명당 ${PCATN[c]} ${scNoun()} 수`;
    if(m==='academies') return `${PCATN[c]} ${scNoun()} 수`;
    return `${scNoun()} 중 ${PCATN[c]} 비중`;
  }
  if(dm==='public'){
    const n=LVN[c];
    return m==='ratio'?`${n} 교원 1인당 학생 수`:(m==='teachers'?`${n} 교원 수`:`${n} 재학생 수`);
  }
  const n=PATHN[c];
  return m==='rate'?`중학교 졸업자 중 ${n} 진학률`:`${n} 진학자 수`;
}
function tabName(m){
  const c=cat();
  switch(m){
    case 'students': return '초중고 학생 수';
    case 'per10k': return c==='all'?'학생 1만 명당 학원 수':'1만 명당 수';
    case 'academies': return c==='all'?'사설학원 수':`${PCATN[c]} ${scNoun()} 수`;
    case 'share': return '전체 중 비중';
    case 'ratio': return '교원 1인당 학생 수';
    case 'teachers': return '교원 수';
    case 'pstudents': return '재학생 수';
    case 'rate': return '진학률';
    case 'pcount': return '진학자 수';
  }
}
const unit=m=>(m==='share'||m==='rate')?'':((m==='per10k'||m==='academies')?'곳':'명');
const shortCount=v=>v>=10000?(v/10000).toFixed(1)+'만':nf(v);
function full(m,v){
  if(m==='per10k'||m==='ratio') return v.toFixed(1);
  if(m==='share'||m==='rate') return v.toFixed(1)+'%';
  return nf(v);
}
function short(m,v){
  if(m==='per10k'||m==='ratio') return v.toFixed(1);
  if(m==='share') return v.toFixed(0)+'%';
  if(m==='rate') return v.toFixed(1)+'%';
  if(m==='students'||m==='pstudents') return shortCount(v);
  return nf(v);
}
function edge(m,v){
  if(m==='students'||m==='pstudents') return shortCount(v);
  if(m==='share'||m==='rate') return +v.toFixed(1)+'%';
  if(m==='per10k'||m==='ratio') return String(+v.toFixed(1));
  return nf(v);
}
function breaks(){
  const m=met();
  if(dom()==='private'&&(cat()==='all'||m==='students')) return FIXED[m];
  const s=D.map(d=>val(d,m)).sort((a,b)=>a-b);
  const inc=r=>r[0]>s[0]&&r.every((x,i)=>i===0||x>r[i-1]);
  const q=[5,10,15,20].map(i=>s[i]);
  for(const p of [2,3,4]){
    const r=q.map(x=>Number(x.toPrecision(p)));
    if(inc(r)) return r;
  }
  const lo=s[0], hi=s[s.length-1];
  let r=[1,2,3,4].map(i=>lo+(hi-lo)*i/5);
  if(['academies','teachers','pstudents','pcount'].includes(m)){
    r=r.map(Math.round);
    for(let i=1;i<4;i++) if(r[i]<=r[i-1]) r[i]=r[i-1]+1;
  } else r=r.map(x=>Number(x.toPrecision(2)));
  return r;
}

function breakdown(d){
  const c=cat(), dm=dom();
  if(dm==='private'){
    const a=arr(d), tot=a.reduce((x,y)=>x+y,0);
    const rows=['art','kor','math','both','eng','etc'].map(k=>`<li class="${k===c?'cur':''}"><span>${PCATN[k]}</span><span>${nf(a[IDX[k]])}곳</span><span class="rk">${(a[IDX[k]]/tot*100).toFixed(1)}%</span></li>`).join('');
    return `<p class="sub">학원 분류 (${scNoun()} ${nf(tot)}곳)</p><ul class="rows tight">${rows}</ul>`;
  }
  if(dm==='public'){
    const rows=['kg','el','mid','high'].map(k=>{const [S,T]=d.P[k];
      return `<li class="${k===c?'cur':''}"><span>${LVN[k]}</span><span>${(S/T).toFixed(1)}명</span><span class="rk">교원 ${nf(T)}명</span></li>`}).join('');

  }

}

    cell.setAttribute('aria-label',`${d.name}, ${ind.t} ${ind.f(vals[i])}, 25개 구 중 ${o[L].ranks[i]}위`);
  });
  OV.legend.innerHTML=`<div class="row"><span>${ind.f(Math.min(...vals))}</span><span class="ramp">${[1,2,3,4,5].map(c=>`<i class="sw" data-c="${c}"></i>`).join('')}</span><span>${ind.f(Math.max(...vals))}</span></div><div class="ovb">구간 경계 ${b.map(x=>edgeOv(ind,x)).join(' · ')}</div>`;
  placeOv(); hvOv();
}

let RANKTXT={};
function place(){
  const w=$('map').getBoundingClientRect().width||VBW, s=w/VBW, narrow=w<520, k=view.k;
  const grow=Math.min(1.7,1+0.22*(k-1));
  const nfz=(narrow?9.5:12)*grow/(s*k), vf=(narrow?8.5:10.5)*grow/(s*k);
  D.forEach(d=>{
    const l=lblEls[d.name];
    l.t.setAttribute('x',d.cx); l.t.setAttribute('y',d.cy);
    l.n.setAttribute('x',d.cx); l.n.setAttribute('dy',(-vf*0.1)+'');
    l.n.setAttribute('font-size',nfz);
    l.v.setAttribute('x',d.cx); l.v.setAttribute('dy',(vf*1.25)+'');
    l.v.setAttribute('font-size',vf);
    l.r.setAttribute('x',d.cx); l.r.setAttribute('dy',(vf*1.25)+''); l.r.setAttribute('font-size',vf);
    l.r.textContent=(k>=1.6&&RANKTXT[d.name])?RANKTXT[d.name]:'';
  });
}
// ---------------- 확대·이동 (세계지도처럼 끌어서 보기) ----------------
const view={x:0,y:0,k:1};
const BB={};
D.forEach(d=>{
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  d.d.split(/[MLZ]/).filter(Boolean).forEach(p=>{const [x,y]=p.split(',').map(Number); if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;});
  BB[d.name]={x0,y0,x1,y1};
});
let suppress=false, lastPinned=null, anim=0;
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const clampView=v=>{
  const k=Math.min(8,Math.max(1,v.k));
  return {k,x:Math.min(0,Math.max(VBW*(1-k),v.x)),y:Math.min(0,Math.max(VBH*(1-k),v.y))};
};
function applyView(){
  const svg=$('map');
  $('vp').setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
  svg.style.setProperty('--k',view.k);
  svg.style.touchAction=view.k>1.01?'none':'pan-y';
  place();
}
function setMapView(v){Object.assign(view,clampView(v)); applyView();}
function animateTo(target){
  const tg=clampView(target); cancelAnimationFrame(anim);
  if(reduceMotion){Object.assign(view,tg); applyView(); return;}
  const s0={...view}, t0=performance.now(), dur=480;
  const step=now=>{
    const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3);
    Object.assign(view,{k:s0.k+(tg.k-s0.k)*e,x:s0.x+(tg.x-s0.x)*e,y:s0.y+(tg.y-s0.y)*e});
    applyView(); if(p<1) anim=requestAnimationFrame(step);
  };
  anim=requestAnimationFrame(step);
}
function zoomToDistrict(name){
  const b=BB[name], w=b.x1-b.x0, h=b.y1-b.y0, cx=(b.x0+b.x1)/2, cy=(b.y0+b.y1)/2;
  const k=Math.min(5.5,Math.max(1.8,Math.min(VBW/(w*2.4),VBH/(h*2.4))));
  animateTo({k,x:VBW/2-k*cx,y:VBH/2-k*cy});
}
function zoomAt(cx,cy,nk){
  const r=$('map').getBoundingClientRect(), ux=(cx-r.left)/r.width*VBW, uy=(cy-r.top)/r.height*VBH;
  nk=Math.min(8,Math.max(1,nk)); const f=nk/view.k; cancelAnimationFrame(anim);
  setMapView({k:nk,x:ux-(ux-view.x)*f,y:uy-(uy-view.y)*f});
}
function zoomBy(f){
  const nk=Math.min(8,Math.max(1,view.k*f)), g=nk/view.k, ux=VBW/2, uy=VBH/2;
  animateTo({k:nk,x:ux-(ux-view.x)*g,y:uy-(uy-view.y)*g});
}
function syncView(){
  if(dom()==='combo') return;
  if(pinned!==lastPinned){ lastPinned=pinned; if(pinned) zoomToDistrict(pinned); else animateTo({k:1,x:0,y:0}); }
}
function tipHtml(name){
  const d=D.find(o=>o.name===name);
  if(dom()==='rel'){const o=REL.find(q=>q.d===d); if(!o) return ''; return `<b>${name}</b><br>${xLabel()} ${o.x.toFixed(1)}<br>${PATHN[ST.rel.y]} 진학률 ${o.y.toFixed(1)}%`;}
  const m=met(); return `<b>${name}</b><br>${title()} ${full(m,val(d,m))}${unit(m)}<br>25개 구 중 ${rankOf(d,m)}위`;
}
function hideTip(){$('tip').hidden=true}
function showTip(e){
  const tip=$('tip');
  if(e.pointerType!=='mouse'||!hover){tip.hidden=true;return}
  tip.innerHTML=tipHtml(hover); tip.hidden=false;
  const b=$('mapbox').getBoundingClientRect(); let x=e.clientX-b.left+14, y=e.clientY-b.top+14;
  if(x+tip.offsetWidth>b.width-4) x=e.clientX-b.left-tip.offsetWidth-14;
  if(y+tip.offsetHeight>b.height-4) y=e.clientY-b.top-tip.offsetHeight-14;
  tip.style.left=Math.max(4,x)+'px'; tip.style.top=Math.max(4,y)+'px';
}
(function(){
  const svg=$('map'), ptrs=new Map(); let pan=null, pinch=null, dragging=false;
  svg.addEventListener('wheel',e=>{
    e.preventDefault(); hideTip();
    const dy=e.deltaMode===1?e.deltaY*16:e.deltaY;
    zoomAt(e.clientX,e.clientY,view.k*Math.exp(-dy*(e.ctrlKey?0.012:0.0016)));
  },{passive:false});
  svg.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1) pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,id:e.pointerId};
    if(ptrs.size===2){const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,k:view.k}; pan=null; dragging=true; hideTip();}
  });
  svg.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()]; zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d); return;}
    if(pan&&ptrs.size===1&&e.pointerId===pan.id){
      const dx=e.clientX-pan.x, dy=e.clientY-pan.y;
      if(!dragging&&Math.hypot(dx,dy)>5){
        if(view.k<=1.01&&e.pointerType!=='mouse'){pan=null;return}
        dragging=true; try{svg.setPointerCapture(e.pointerId)}catch(_){} hideTip(); cancelAnimationFrame(anim);
      }
      if(dragging){const r=svg.getBoundingClientRect(); setMapView({k:view.k,x:pan.vx+dx/r.width*VBW,y:pan.vy+dy/r.height*VBH}); svg.style.cursor='grabbing';}
    }
    if(!dragging) showTip(e);
  });
  const end=e=>{
    ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null;
    if(ptrs.size===0){ if(dragging){suppress=true; setTimeout(()=>{suppress=false},0);} dragging=false; pan=null; svg.style.cursor=''; }
    else if(ptrs.size===1){const [id,p]=[...ptrs.entries()][0]; pan={x:p.x,y:p.y,vx:view.x,vy:view.y,id};}
  };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  svg.addEventListener('pointerleave',hideTip);
  $('zin').onclick=()=>zoomBy(1.6); $('zout').onclick=()=>zoomBy(1/1.6); $('zreset').onclick=()=>animateTo({k:1,x:0,y:0});
})();

if('ResizeObserver' in window) new ResizeObserver(place).observe($('map')); else addEventListener('resize',place);
paint();
</script>
</body>
</html>
